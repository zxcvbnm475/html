<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型的组成</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            background-color: pink;
            /* 内容与盒子边缘之间 */
            padding: 20px; /* 内边距 */
            /* 边框线 */
            border: 1px solid #000;
            /* 出现在盒子之外,拉开两个盒子间的距离 */
            /* 外边距 */
            margin: 20px;
        }
    </style>
</head>
<body>
    <div>div标签</div>
</body>
</html>
