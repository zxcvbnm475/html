<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子阴影</title>
    <style>
        div{
            margin:50px,auto;
            width: 200px;
            height: 100px;
            background-color: lightblue;
            /* box-shadow: 10px 10px 5px grey; 内外阴影 */
             /* 水平偏移 垂直偏移 模糊距离 阴影颜色 */
             /* 水平偏移 垂直偏移 模糊距离 扩散距离 阴影颜色 */
             box-shadow: 10px 10px 5px 5px grey;
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
