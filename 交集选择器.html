<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交集选择器</title>
    <style>
        p.box {
            color: red;
            /* 选中同时具有p和box类的元素 */

        }
    </style>
</head>
<body>
    <p class="box">这是p标签</p>
    <p>这是另一个p标签</p>
    <div class="box">这是div标签</div>
</body>
</html>
