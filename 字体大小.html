<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字体大小</title>
    <style>
        .small {
            font-size: 12px;
        }
        .medium {
            font-size: 16px;
        }
        .large {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <p class="small">This is a small paragraph.</p>
    <p class="medium">This is a medium paragraph.</p>
    <p class="large">This is a large paragraph.</p> 
</body>
</html>
