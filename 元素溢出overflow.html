<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素溢出</title>
    <style>
        div {
            width: 200px;
            height: 100px;
            background-color: pink;
            /* overflow: hidden; 隐藏溢出内容 */
            /* overflow: scroll; 显示有水平和垂直滚动条 */
            overflow: auto; /* 根据需要显示滚动条且无水平滚动条 */
        }
    </style>

</head>
<body>
    <div>
        <p>这是一个段落。</p>
        <p>这是另一个段落。</p>
        <p>这是第三个段落。</p>
        <p>这是第四个段落。</p>
        <p>这是第五个段落。</p>
        <p>这是第六个段落。</p>
        <p>这是第七个段落。</p>
        <p>这是第八个段落。</p>
        <p>这是第九个段落。</p>
        <p>这是第十个段落。</p>
    </div>
</body>
</html>
