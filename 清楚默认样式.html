<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清除默认样式</title>
    <style>
        /* 清除默认样式 */
        /* 清除外边距与内边距 */
        /* * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        } */
         /* 去掉列表的项目符号 */
         li{
            list-style: none;
         }
    </style>
</head>
<body>
    <h1>标题</h1>
    <p>段落内容</p>
    <ul>
        <li>列表项1</li>
        <li>列表项2</li>
        <li>列表项3</li>
    </ul>
</body>
</html>
