<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>版心居中</title>
    <style>
        div {
            /* 版心居中有要求；盒子要有宽度 */
            width: 500px;
            height: 300px;
            background-color: pink;
            /* 外边距 */
            /* margin: 50px; */
            /* margin-left: 100px; */
            /* margin:50px 100px; */
            margin: 0 auto; /* 上外边距是0，左右外边距自动，水平居中写法 */
        }
    </style>
</head>
<body>
    <div>版心内容</div>
</body>
</html>
