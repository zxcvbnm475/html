<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第三题</title>
    <style>
        /* (行内样式，id选择器,类选择器,标签选择器) */
        /* (0,2,0,0) */
        #father #son{
            color:blue
        }
        /* (0,1,1,1) */
        #father p.c2{
            color: black;
        }
        /* (0,0,2,2) */
        div.c1 p.c2{
            color: red;
        }
        /* 后两个全是继承(都是div那一行) */
        #father{
            color: green !important;
        }
        div#father.c1{
            color: yellow;
        }

    </style>
</head>
<body>
    <div id="father" class="c1">
        <p id="son" class="c2">
            文字的颜色是什么？
        </p>   
    </div>
</body>
</html>
