<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景图缩放</title>
    <style>
        div {
            width: 500px;
            height: 300px;
            /* 背景图默认是平铺(复制)效果 */
            background-image: url('your-image.jpg');
            /* 缩放contain:如果图的宽高跟盒子尺寸相等停止缩放，可能导致盒子有露白 */
            /* background-size: contain; */
            /* 缩放cover:如果图的宽高超过盒子尺寸，会显示不全 */
            /* background-size: cover; */
            /* 缩放100%:将背景图缩放到与盒子尺寸完全等比缩放 */
            /* background-size: 100%; */
        }
    </style>
</head>
<body>
    <div>div标签</div>
</body>
</html>
