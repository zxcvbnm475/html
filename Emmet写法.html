<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmet写法</title>
    <style>
        div{
            /* w500 */
            width: 500px;
            /* h300 */
            height: 300px;
            /* bgc */
            background-color: #ccc;
            /* w500+h300+bgc */
            width: 500px;
            height: 300px;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <!--vscode p.box -->
    <p class="box"></p>
    <!-- div.box -->
    <div class="box"></div>
    <!-- div#box -->
     <div id="box"></div>
    <!-- 同级标签div+p -->
      <div></div>
      <p></p>
    <!-- 父子级标签div>p -->
     <div>
        <p></p>
     </div>
     <!--多个相同标签span*3  -->
     <span></span><span></span><span></span>
     <!--有内容的标签div{222}  -->
     <div>222</div>
     
</body>
</html>
