<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font属性</title>
    <style>
        div {
            /* font属性必须写字号字体，否则不生效 */
            font: italic 700 30px/2 "Times New Roman", serif;
        }
    </style>
</head>
<body>
    <div>
        <p>This is a paragraph with a specific font.</p>
    </div>
</body>
</html>
