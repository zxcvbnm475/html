<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伪类选择器</title>
    <style>
        /* 任何标签都可以设置hover伪类 */
        a:hover {
            color: red;
        }
        /* 选中(hover)鼠标悬停时的链接为红色 */
        .box:hover {
            color: blue;
        }
    </style>
</head>
<body>
    <a href="#">这是一个链接</a>
    <div class="box">这是一个div标签</div>
</body>
</html>
