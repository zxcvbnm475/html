<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css特性-继承性</title>
    <style>
        body {
            color: red;
            font-weight: 700;
            font-size: large;
        }
        p {
            /* p标签会继承body的color属性 */
        }
    </style>
</head>
<body>
    <div>div标签</div>  
    <p>p标签</p>
    <span>span标签</span>
    <!-- 如果标签自己有样式不继承 -->
    <a href="#">a 标签</a>
    <h1>h1标签</h1>
</body>
</html>
