<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本对齐方式</title>
    <style>
        h1{
            text-align: center;
        }
        .right {
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>This is a centered heading.</h1>
    <p class="right">This is a paragraph aligned to the right.</p>
</body>
</html>
