<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型-padding多值写法</title>
    <style>
        div{
            width: 500px;
            height: 300px;
            background-color: lightblue;
            /* 内边距 */
            /* padding: 20px; 上右下左内边距都是20px */
            /* padding: 20px 10px; 上下内边距是20px，左右内边距是10px 上下、左右写法*/
            /* padding: 20px 10px 30px; 上内边距是20px，左右内边距是10px，下内边距是30px 上、左右、下写法*/
            padding: 20px 10px 30px 40px; /* 上内边距是20px，右内边距是10px，下内边距是30px，左内边距是40px ,顺时针写法*/
        }
    </style>
</head>
<body>
    <div>div标签</div>
</body>
</html>
