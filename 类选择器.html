<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>类选择器</title>
    <style>
        .blue {
            color: blue;
            font-size: 30px;
        }
        .size{
            font-size: 50px;
        }
    </style>
</head>
<body>
    <!-- 类选择器可以给多个元素使用 -->
    <p>This is a paragraph.</p>
    <p class="blue">This is a paragraph.</p>
    <div class="blue size">
        This is another paragraph.</div>
</body>
</html>
