<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型尺寸计算</title>
    <style>
        div {
            width: 200px;
            height: 200px;
            background-color: pink;
            /* 手动减法 */
            /* 内减模式:不需要手动减法，+padding与border不会撑大盒子盒子尺寸大小计算方式 */
            box-sizing: border-box;
            /* 内边距 */
            padding: 20px;
           
        }
    </style>
</head>
<body>
    <div>div标签</div>
</body>
</html>
