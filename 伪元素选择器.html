<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伪元素选择器</title>
    <style>
        div{
            width: 300px;
            height: 300px;
            background-color: pink; 
        }
        /* 显示模式均是行内 */
        div::before{
            content: "Before";
            width: 100px;
            height: 100px;
            background-color: #fff;
            display: block;
        }
        /* 必须设置content属性,没有content属性,否则伪元素不生效 */
        div::after{
            content: "After";
            width: 100px;
            height: 100px;
            background-color: orange;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div>d</div>
</body>
</html>
