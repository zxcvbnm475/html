<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆角-基本使用</title>
    <style>
        div{
            margin:50px,auto;
            width: 200px;
            height: 100px;
            background-color: lightblue;
            /* border-radius: 20px; 圆角 */
            /* border-radius: 20px 0px 20px 0px; 圆角（顺时针）顺序：左上、右上、右下、左下 */
            /* 三值 左上，右上&左下 右下 */
            /* border-radius: 10px 40px 90px; */
            /* 双值 左上+右下 右上+左下 */
            border-radius:20px 40px;
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
