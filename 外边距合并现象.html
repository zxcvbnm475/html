<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外边距合并现象</title>
    <style>
        .one {
            width: 200px;
            height: 100px;
            background-color: lightblue;
            margin-bottom: 20px; /* 外边距 */
        }
        .two {
            width: 200px;
            height: 100px;
            background-color: lightcoral;
            margin-top: 30px; /* 外边距 */
        }
    </style>
</head>
<body>
    <div class="one">one</div>
    <div class="two">two</div>
</body>
</html>
