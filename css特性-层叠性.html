<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css特性-层叠性</title>
    <style>
        /* 覆盖，叠加 */
        div {
            color: red;
            font-weight: 700;
        }
        div {
            color: green;
            font-size: large;
        }
        /* div标签的颜色是绿色，因为后面定义的样式覆盖了前面定义的样式 */
        /* 如果两个样式的优先级一样，后面定义的样式覆盖前面定义的样式 */
    </style>
</head>
<body>
    <div>div标签</div>
</body>
</html>
