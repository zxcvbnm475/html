<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆角-特殊场景</title>
    <style>
        /* 圆形 */
        img{
            width: 100px;
            height: 100px;
            /* 宽高的一半也可以是50px */
            /* 最大值是50%,超过50%无效果 */
            border-radius: 50%;
        }
        /* 圆角矩形 */
        div{
            margin:50px,auto;
            width: 200px;
            height: 100px;
            background-color: lightblue;
            /* 高度取值的一半 */
            border-radius:50px;
        }
    </style>
</head>
<body>
    <!-- 正圆形--头像 -->
    <img src="#" alt="#">
    <!-- 圆角矩形 -->
    <div></div>
</body>
</html>
